def verifyCandidateCompanionArchiveFreshness = { File archive ->
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def result = exec {
        commandLine 'node', file('tools/compat/verify-companion-package-archive.mjs').absolutePath, archive.absolutePath
        standardOutput = stdout
        errorOutput = stderr
        ignoreExitValue = true
    }
    if (result.exitValue != 0) {
        def diagnostic = (stderr.toString('UTF-8') + stdout.toString('UTF-8')).trim()
        throw new GradleException(diagnostic ?: 'WS-CANDIDATE-COMPANION-ARCHIVE-INVALID: archive freshness verifier failed.')
    }
    logger.lifecycle(stdout.toString('UTF-8').trim())
}

def verifyServerOnlyArchive = { File archive ->
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def result = exec {
        commandLine 'node', file('tools/compat/verify-server-only.mjs').absolutePath, '--jar', archive.absolutePath
        standardOutput = stdout
        errorOutput = stderr
        ignoreExitValue = true
    }
    if (result.exitValue != 0) {
        def diagnostic = (stderr.toString('UTF-8') + stdout.toString('UTF-8')).trim()
        throw new GradleException(diagnostic ?: 'WS-SERVER-ONLY-REJECTED: packaged bytecode verification failed.')
    }
    logger.lifecycle(stdout.toString('UTF-8').trim())
}

