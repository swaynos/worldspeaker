def packageCompatibilityDocuments = { File output ->
    verifyGodPresetArchiveFreshness.call()
    exec {
        commandLine 'node', file('tools/compat/package-status-docs.mjs').absolutePath, output.absolutePath
    }
}

tasks.register('assembleCandidate') {
    group = 'distribution'
    description = 'Builds an explicitly unqualified candidate distribution.'
    dependsOn tasks.named('build'), tasks.named('validateDeploymentContract'), tasks.named('generateCompatibilityDocs'), tasks.named('packageCompanion'), tasks.named('verifyServerOnly')
    doLast {
        verifyCandidateBuildEnvironment.call()
        def companionArchive = file('companion/worldspeaker-openclaw-channel-0.1.0-dev.1.tgz')
        if (!companionArchive.exists()) throw new GradleException('WS-CANDIDATE-COMPANION-MISSING: exact companion package was not produced.')
        // This action-boundary check must remain here: -x packageCompanion can
        // leave an old archive in place, and graph dependencies can be excluded.
        // Run it before deleting or mutating any candidate output.
        verifyCandidateCompanionArchiveFreshness.call(companionArchive)
        verifyGodPresetArchiveFreshness.call()
        def jar = tasks.named('remapJar').get().archiveFile.get().asFile
        // This copy-boundary invocation remains mandatory if -x skips verifyServerOnly.
        verifyServerOnlyArchive.call(jar)
        def output = layout.buildDirectory.dir('distributions/worldspeaker-candidate').get().asFile
        delete output
        output.mkdirs()
        copy { from jar; into output }
        copy { from 'compatibility/deployment.schema.json'; into output }
        packageCompatibilityDocuments.call(output)
        def packagedCompatibility = new File(output, 'compatibility.md')
        copy { from companionArchive; into output }
        def requirements = new File(output, 'REQUIREMENTS.md')
        requirements.text = packagedCompatibility.text + '\n\nCandidate assembly does not itself confer qualification or support.\n'
        def artifacts = output.listFiles().findAll { it.isFile() && it.name != 'outer-manifest.json' }.sort { it.name }
        def outer = [
            schemaVersion: 1,
            deploymentId: deployment.deploymentId,
            manifestRevision: deployment.manifestRevision,
            deploymentManifestSha256: deploymentHash,
            qualificationState: deployment.qualification.state,
            artifacts: artifacts.collect { item -> [name: item.name, bytes: item.length(), sha256: MessageDigest.getInstance('SHA-256').digest(item.bytes).encodeHex().toString()] }
        ]
        new File(output, 'outer-manifest.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(outer)) + '\n'
    }
}

def verifyApprovedReleaseEvidence = {
    def approval = file('docs/qualification/COMPAT-01/approved.json')
    if (!approval.exists()) {
        throw new GradleException('WS-RELEASE-UNQUALIFIED: no approved COMPAT-01 evidence exists; candidate artifacts cannot be assembled as a supported release.')
    }
    def mod = tasks.named('remapJar').get().archiveFile.get().asFile
    def companionArchive = file('companion/worldspeaker-openclaw-channel-0.1.0-dev.1.tgz')
    verifyGodPresetArchiveFreshness.call()
    exec {
        commandLine 'node', file('tools/compat/verify-release-evidence.mjs').absolutePath,
            '--record', approval.absolutePath,
            '--manifest', deploymentFile.absolutePath,
            '--mod', mod.absolutePath,
            '--companion', companionArchive.absolutePath,
            '--preset', godPresetArchive.get().asFile.absolutePath
    }
}

tasks.register('verifyReleaseCompatibility') {
    group = 'verification'
    description = 'Fails closed unless an approved, exact-artifact qualification is present.'
    dependsOn tasks.named('remapJar'), tasks.named('packageCompanion'), tasks.named('validateDeploymentContract'), tasks.named('validateApprovedQualification'), tasks.named('verifyServerOnly')
    doLast {
        verifyApprovedReleaseEvidence.call()
        verifyCandidateBuildEnvironment.call()
    }
}

tasks.register('assembleRelease') {
    group = 'distribution'
    // Keep contract validation direct: excluding the verifier must not remove the
    // validators for the manifest and any present approval record.
    dependsOn tasks.named('verifyReleaseCompatibility'), tasks.named('validateDeploymentContract'), tasks.named('validateApprovedQualification')
    // Deliberately declare no outputs. Gradle must run the authorization check on
    // every invocation, including when a stale release directory already exists.
    outputs.upToDateWhen { false }
    doLast {
        // Task exclusion (-x verifyReleaseCompatibility) skips the verifier task
        // and its action, so enforce the same approval check at the release boundary.
        verifyApprovedReleaseEvidence.call()
        verifyCandidateBuildEnvironment.call()
        def jar = tasks.named('remapJar').get().archiveFile.get().asFile
        // This copy-boundary invocation remains mandatory if -x skips verifyServerOnly.
        verifyServerOnlyArchive.call(jar)
        def output = layout.buildDirectory.dir('distributions/worldspeaker-release').get().asFile
        output.mkdirs()
        copy { from jar; into output }
        copy { from file('companion/worldspeaker-openclaw-channel-0.1.0-dev.1.tgz'); into output }
        packageCompatibilityDocuments.call(output)
        copy { from godPresetArchive; into output }
        copy { from 'docs/qualification/COMPAT-01/approved.json'; into output }
    }
}

tasks.register('preflightCompatibility', Exec) {
    group = 'verification'
    description = 'Checks local Java, Node, npm, and optionally packaged metadata without starting a server.'
    commandLine 'node', 'tools/compat/preflight.mjs'
}

tasks.named('check') {
    dependsOn tasks.named('validateDeploymentContract'), tasks.named('verifyServerOnly'), tasks.named('verifyPublicBodyUnicodeData'), tasks.named('verifyGodPreset'), tasks.named('verifyAbilityContracts')
}
