def candidateJava = deployment.target.java
def candidatePlatform = candidateJava.platform
def normalizeArchitecture = { String architecture ->
    switch (architecture?.toLowerCase(Locale.ROOT)) {
        case ['x86_64', 'amd64', 'x64']:
            return 'x86_64'
        case ['aarch64', 'arm64']:
            return 'aarch64'
        default:
            return architecture?.toLowerCase(Locale.ROOT) ?: 'unknown'
    }
}
def unquoteReleaseValue = { String value ->
    if (value == null) return null
    value = value.trim()
    if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) {
        return value.substring(1, value.length() - 1)
    }
    return value
}
def readPropertiesFile = { File propertiesFile ->
    def values = new Properties()
    if (propertiesFile.isFile()) {
        propertiesFile.withInputStream { stream -> values.load(stream) }
    }
    values
}
def readOsRelease = {
    def values = [:]
    def releaseFile = file('/etc/os-release')
    if (releaseFile.isFile()) {
        releaseFile.eachLine('UTF-8') { line ->
            def match = line =~ /^([A-Z_]+)=(.*)$/
            if (match.matches()) values[match[0][1]] = unquoteReleaseValue(match[0][2])
        }
    }
    values
}
def candidateBuildFacts = {
    def compilerMetadata = tasks.named('compileJava', JavaCompile).get().javaCompiler.get().metadata
    def compilerRelease = readPropertiesFile(new File(compilerMetadata.installationPath.asFile, 'release'))
    def osRelease = readOsRelease.call()
    [
        gradleJavaVendor: System.getProperty('java.vendor'),
        gradleJavaRuntimeVersion: Runtime.version().toString(),
        gradleJavaMajor: Runtime.version().feature().toString(),
        compilerJavaVendor: unquoteReleaseValue(compilerRelease.getProperty('IMPLEMENTOR')),
        compilerJavaRuntimeVersion: compilerMetadata.javaRuntimeVersion.toString(),
        compilerJavaMajor: compilerMetadata.languageVersion.asInt().toString(),
        compilerArchitecture: normalizeArchitecture(unquoteReleaseValue(compilerRelease.getProperty('OS_ARCH'))),
        osName: System.getProperty('os.name'),
        osArchitecture: normalizeArchitecture(System.getProperty('os.arch')),
        distributionId: osRelease.ID ?: 'unknown',
        distributionVersion: osRelease.VERSION_ID ?: 'unknown',
        kernel: System.getProperty('os.version')
    ]
}
def verifyCandidateBuildEnvironment = {
    def facts = candidateBuildFacts.call()
    def expectedVersion = candidateJava.runtimeVersion.toString()
    def expectedVendor = candidateJava.vendor.toString()
    def expectedMajor = candidateJava.major.toString()
    def refusals = []

    if (candidatePlatform != 'Linux x86-64') {
        refusals << "WS-CANDIDATE-PLATFORM-CONTRACT: manifest platform '${candidatePlatform}' does not match the finite candidate platform Linux x86-64."
    }
    if (facts.gradleJavaVendor != expectedVendor) {
        refusals << "WS-CANDIDATE-JAVA-VENDOR-MISMATCH: Gradle JVM vendor is '${facts.gradleJavaVendor}'; expected '${expectedVendor}'."
    }
    if (facts.gradleJavaRuntimeVersion != expectedVersion) {
        refusals << "WS-CANDIDATE-JAVA-RUNTIME-MISMATCH: Gradle JVM is ${facts.gradleJavaRuntimeVersion}; expected ${expectedVersion} (${expectedVendor})."
    }
    if (facts.gradleJavaMajor != expectedMajor) {
        refusals << "WS-CANDIDATE-JAVA-MAJOR-MISMATCH: Gradle JVM major is ${facts.gradleJavaMajor}; expected ${expectedMajor}."
    }
    if (facts.compilerJavaVendor != expectedVendor) {
        refusals << "WS-CANDIDATE-TOOLCHAIN-VENDOR-MISMATCH: Java compiler vendor is '${facts.compilerJavaVendor}'; expected '${expectedVendor}'."
    }
    if (facts.compilerJavaRuntimeVersion != expectedVersion) {
        refusals << "WS-CANDIDATE-TOOLCHAIN-RUNTIME-MISMATCH: Java compiler is ${facts.compilerJavaRuntimeVersion}; expected ${expectedVersion} (${expectedVendor})."
    }
    if (facts.compilerJavaMajor != expectedMajor) {
        refusals << "WS-CANDIDATE-TOOLCHAIN-MAJOR-MISMATCH: Java compiler major is ${facts.compilerJavaMajor}; expected ${expectedMajor}."
    }
    if (!facts.osName.equalsIgnoreCase('Linux') || facts.osArchitecture != 'x86_64' || facts.compilerArchitecture != 'x86_64' ||
        facts.distributionId != 'ubuntu' || facts.distributionVersion != '24.04') {
        refusals << "WS-CANDIDATE-PLATFORM-MISMATCH: expected Ubuntu 24.04 Linux x86-64; observed ${facts.distributionId} ${facts.distributionVersion}, ${facts.osName}/${facts.osArchitecture}, compiler/${facts.compilerArchitecture}."
    }
    if (!refusals.isEmpty()) {
        throw new GradleException(refusals.join('\n'))
    }
    logger.lifecycle("WS-CANDIDATE-BUILD-ENVIRONMENT: ${expectedVendor} ${expectedVersion}; Ubuntu 24.04 Linux x86-64; kernel ${facts.kernel}.")
}

tasks.register('verifyCandidateBuildEnvironment') {
    group = 'verification'
    description = 'Requires the exact recorded build/runtime JDK and finite candidate platform before candidate or qualified artifact assembly.'
    doLast {
        verifyCandidateBuildEnvironment.call()
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(tasks.named('assembleCandidate').get())) {
        // Refuse before build/package dependencies can emit candidate outputs.
        // localDevelopment is deliberately not consulted for artifact assembly.
        verifyCandidateBuildEnvironment.call()
    }
    def releaseAssemblyRequested = graph.hasTask(tasks.named('assembleRelease').get()) ||
        graph.hasTask(tasks.named('verifyReleaseCompatibility').get())
    def localCompilationOrTestRequested = graph.allTasks.any { task -> task.name in ['compileJava', 'compileTestJava', 'test'] }
    if (localCompilationOrTestRequested && !releaseAssemblyRequested) {
        try {
            verifyCandidateBuildEnvironment.call()
        } catch (GradleException mismatch) {
            if (project.findProperty('localDevelopment')?.toString() != 'true') {
                throw new GradleException('WS-LOCAL-DEV-LABEL-REQUIRED: this compile/test run is outside the pinned candidate environment; rerun local development work with -PlocalDevelopment=true. This label does not authorize candidate or release assembly.', mismatch)
            }
            logger.lifecycle("WS-LOCAL-DEV-ONLY: ${Runtime.version()} ${System.getProperty('os.name')}/${System.getProperty('os.arch')}; compile/test tasks only, not a pinned candidate build.")
        }
    }
}

