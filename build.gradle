import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import org.gradle.jvm.toolchain.JvmVendorSpec

def deploymentFile = file('compatibility/deployment.json')
def deployment = new JsonSlurper().parse(deploymentFile)
def deploymentHash = MessageDigest.getInstance('SHA-256').digest(deploymentFile.bytes).encodeHex().toString()

buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    configurations.classpath.resolutionStrategy.activateDependencyLocking()
    dependencies {
        def selected = new JsonSlurper().parse(new File(rootDir, 'compatibility/deployment.json'))
        classpath "net.fabricmc:fabric-loom:${selected.buildDependencies.fabricLoom}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

group = 'org.worldspeaker'
version = deployment.mod.version
base {
    archivesName = deployment.mod.id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(deployment.target.java.major as int)
        vendor = JvmVendorSpec.ADOPTIUM
    }
    withSourcesJar()
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
