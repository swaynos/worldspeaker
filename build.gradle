tasks.register('generateDeploymentMetadata') {
    inputs.file(deploymentFile)
    inputs.files('compatibility/ability-contracts-v1.json', 'compatibility/ability-contracts-v1.schema.json',
            'compatibility/ability-discovery-v1.schema.json', 'compatibility/ability-predicates-v1.schema.json',
            'compatibility/ability-contracts-v1-schema-resource.json')
    outputs.dir(generatedContractResources)
    outputs.dir(generatedContractSources)
    doLast {
        def manifest = new JsonSlurper().parse(deploymentFile)
        def hash = MessageDigest.getInstance('SHA-256').digest(deploymentFile.bytes).encodeHex().toString()
        def resources = generatedContractResources.get().asFile
        def sources = generatedContractSources.get().asFile
        resources.mkdirs()
        sources.mkdirs()
        new File(resources, 'worldspeaker-deployment.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'
        new File(resources, 'worldspeaker-deployment.sha256').text = hash + '\n'
        new File(resources, 'worldspeaker-ability-contracts-v1.json').bytes = file('compatibility/ability-contracts-v1.json').bytes
        new File(resources, 'worldspeaker-ability-contracts-v1.schema.json').bytes = file('compatibility/ability-contracts-v1.schema.json').bytes
        new File(resources, 'worldspeaker-ability-discovery-v1.schema.json').bytes = file('compatibility/ability-discovery-v1.schema.json').bytes
        new File(resources, 'worldspeaker-ability-predicates-v1.schema.json').bytes = file('compatibility/ability-predicates-v1.schema.json').bytes
        new File(resources, 'worldspeaker-ability-contracts-v1-schema-resource.json').bytes = file('compatibility/ability-contracts-v1-schema-resource.json').bytes
        def facts = [
            deploymentId: manifest.deploymentId,
            manifestRevision: manifest.manifestRevision,
            manifestSha256: hash,
            minecraftVersion: manifest.target.minecraft,
            fabricLoaderVersion: manifest.runtimeDependencies.fabricLoader,
            fabricApiVersion: manifest.runtimeDependencies.fabricApi,
            javaVendor: manifest.target.java.vendor,
            javaRuntimeVersion: manifest.target.java.runtimeVersion,
            javaMajor: manifest.target.java.major.toString(),
            openclawVersion: manifest.openclaw.version,
            nodeVersion: manifest.openclaw.node,
            companionVersion: manifest.companion.version,
            protocol: manifest.companion.protocol
        ]
        new File(resources, 'worldspeaker-deployment.properties').withWriter('UTF-8') { writer ->
            facts.each { key, value -> writer.write("${key}=${value}\n") }
        }
        def javaFile = new File(sources, 'org/worldspeaker/generated/DeploymentFacts.java')
        javaFile.parentFile.mkdirs()
        def constants = facts.collect { key, value ->
            def name = key.replaceAll(/([a-z])([A-Z])/, '$1_$2').toUpperCase(Locale.ROOT)
            def escaped = value.toString().replace('\\', '\\\\').replace('"', '\\"')
            "    public static final String ${name} = \"${escaped}\";"
        }.join('\n')
        javaFile.text = """package org.worldspeaker.generated;

/** Generated from compatibility/deployment.json; do not edit. */
public final class DeploymentFacts {
    private DeploymentFacts() {}
${constants}
}
"""
    }
}

sourceSets.main.java.srcDir(generatedContractSources)
sourceSets.main.resources.srcDir(generatedContractResources)

sourceSets {
    loadTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
        resources.srcDir(generatedLoadHarnessResources)
    }
}

tasks.register('generateLoadHarnessMetadata') {
    def harnessSources = fileTree('src/loadTest')
    inputs.files(harnessSources)
    inputs.file(deploymentFile)
    outputs.file(generatedLoadHarnessResources.map { it.file('worldspeaker-load-harness.json') })
    doLast {
        def digest = MessageDigest.getInstance('SHA-256')
        harnessSources.files.sort { left, right ->
            relativePath(left).replace('\\', '/').compareTo(relativePath(right).replace('\\', '/'))
        }.each { source ->
            digest.update(relativePath(source).replace('\\', '/').getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(source.bytes)
            digest.update((byte) 0)
        }
        def metadata = [
            schemaVersion: 1,
            modId: 'worldspeaker_compat_load_harness',
            deploymentId: deployment.deploymentId,
            deploymentManifestSha256: deploymentHash,
            harnessSourcesSha256: digest.digest().encodeHex().toString(),
            entrypoint: 'org.worldspeaker.load.WorldspeakerTickLoadHarness',
        ]
        def output = generatedLoadHarnessResources.get().file('worldspeaker-load-harness.json').asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + '\n'
    }
}

