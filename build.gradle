    minecraft "com.mojang:minecraft:${deployment.target.minecraft}"
    mappings "net.fabricmc:yarn:${deployment.buildDependencies.yarnMappings}:${deployment.buildDependencies.yarnClassifier}"
    modImplementation "net.fabricmc:fabric-loader:${deployment.runtimeDependencies.fabricLoader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${deployment.runtimeDependencies.fabricApi}"

    testImplementation platform("org.junit:junit-bom:${deployment.buildDependencies.javaTestBom}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
